name: Build update (nav + source filtering)

on:
  workflow_dispatch:
  push:
    branches:
      - update-nav-sources-filters
    paths:
      - nuvio-netshare-v3.patch
      - .github/workflows/build-nav-sources-update.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout branch (bundle files live here)
        uses: actions/checkout@v6

      - name: Pin source tree to the commit the patch targets
        run: |
          mkdir -p /tmp/bundle
          mv nuvio-netshare-v3.patch runtime-local.properties /tmp/bundle/
          git fetch --depth=1 origin 10feb659ae3368008a584316bd5e1d2665e3aa6c
          git checkout -f --detach FETCH_HEAD
          mv /tmp/bundle/nuvio-netshare-v3.patch /tmp/bundle/runtime-local.properties .
          for f in nuvio-netshare-v3.patch runtime-local.properties; do
            test -f "$f" || { echo "MISSING BUNDLE FILE: $f"; exit 1; }
          done

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Restore release keystore
        env:
          NVS_KS_B64: ${{ secrets.NVS_KS_B64 }}
        run: |
          echo "$NVS_KS_B64" | base64 -d > nuvio-release.jks
          test -s nuvio-release.jks || { echo "EMPTY KEYSTORE"; exit 1; }

      - name: Apply update patch
        run: git apply nuvio-netshare-v3.patch

      - name: Prepare local.properties (client config + release signing)
        env:
          NVS_KS_PASS: ${{ secrets.NVS_KS_PASS }}
          NVS_KEY_ALIAS: ${{ secrets.NVS_KEY_ALIAS }}
          NVS_KEY_PASS: ${{ secrets.NVS_KEY_PASS }}
        run: |
          cp runtime-local.properties local.properties
          {
            echo ""
            echo "NUVIO_RELEASE_STORE_FILE=nuvio-release.jks"
            echo "NUVIO_RELEASE_STORE_PASSWORD=$NVS_KS_PASS"
            echo "NUVIO_RELEASE_KEY_ALIAS=$NVS_KEY_ALIAS"
            echo "NUVIO_RELEASE_KEY_PASSWORD=$NVS_KEY_PASS"
          } >> local.properties

      - name: Build fullRelease APK (minified, arm64 split)
        run: ./gradlew :androidApp:assembleFullRelease -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore --stacktrace

      - name: Show outputs
        run: |
          ls -la androidApp/build/outputs/apk/full/release/
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          APK=$(ls androidApp/build/outputs/apk/full/release/*arm64-v8a*.apk | head -1)
          "$ANDROID_HOME/build-tools/$BT/aapt2" dump badging "$APK" | head -3 || true

      - name: Upload APK (arm64-v8a)
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-update-apk
          path: androidApp/build/outputs/apk/full/release/*arm64-v8a*.apk
          archive: false
          if-no-files-found: error

      - name: Publish test APK as a prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="test-nav-sources-$(date +%Y%m%d-%H%M%S)"
          APK=$(ls androidApp/build/outputs/apk/full/release/*arm64-v8a*.apk | head -1)
          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Test build: bottom nav + source filtering" \
            --notes "Branch build for testing. Install over the current app (same signing key)."
