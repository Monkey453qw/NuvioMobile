name: Build Nuvio (NetShare patch)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout default branch (bundle files live here)
        uses: actions/checkout@v6

      - name: Pin source tree to the commit the patch targets
        run: |
          mkdir -p /tmp/bundle
          mv nuvio-netshare-support.patch /tmp/bundle/
          git fetch --depth=1 origin 10feb659ae3368008a584316bd5e1d2665e3aa6c
          git checkout -f --detach FETCH_HEAD
          mv /tmp/bundle/nuvio-netshare-support.patch .
          test -f nuvio-netshare-support.patch || { echo "MISSING BUNDLE FILE"; exit 1; }

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Apply NetShare patch
        run: git apply nuvio-netshare-support.patch

      - name: Prepare runtime properties
        run: touch local.properties

      - name: Build fullDebug APK
        run: ./gradlew :androidApp:assembleFullDebug -Pnuvio.android.distribution=full -Pnuvio.ios.distribution=appstore --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: nuvio-netshare-apk
          path: androidApp/build/outputs/apk/full/debug/androidApp-full-debug.apk
          archive: false
          if-no-files-found: error
